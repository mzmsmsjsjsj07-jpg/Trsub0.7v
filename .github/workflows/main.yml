name: Build TR.SUB APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE="TRSUB_v8.1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: TRSUB_v8.1.zip not found in repository root"
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          if [ ! -f project/gradlew ] || [ ! -f project/app/build.gradle ]; then
            echo "ERROR: Android project files are missing from ZIP"
            find project -maxdepth 4 -type f
            exit 1
          fi

          cp -a project/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRSUB-v8.1-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
