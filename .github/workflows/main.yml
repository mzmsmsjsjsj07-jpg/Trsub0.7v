name: Build TR.SUB APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP if present
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Checking ZIP: $ZIP_FILE"
            unzip -t "$ZIP_FILE"
            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project

            if [ -f extracted_project/gradlew ]; then
              cp -a extracted_project/. .
            else
              WRAPPER="$(find extracted_project -type f -name gradlew | head -n 1)"

              if [ -n "$WRAPPER" ]; then
                PROJECT_DIR="$(dirname "$WRAPPER")"
                cp -a "$PROJECT_DIR"/. .
              fi
            fi
          else
            echo "No ZIP file found; using repository files."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and build APK
        shell: bash
        run: |
          set -e

          echo "Searching for gradlew..."
          GRADLEW="$(find . -type f -name gradlew -not -path './.git/*' -not -path './extracted_project/*' | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            echo "Project files:"
            find . -maxdepth 5 -type f | head -n 150
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "Gradle project: $PROJECT_DIR"

          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRSUB-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
