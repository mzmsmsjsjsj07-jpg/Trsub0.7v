name: Build TR.SUB APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP if needed
        shell: bash
        run: |
          set -e
          if find . -maxdepth 1 -type f -name '*.zip' | grep -q .; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
            unzip -t "$ZIP_FILE"
            mkdir -p extracted_project
            unzip -o "$ZIP_FILE" -d extracted_project
            if [ -f extracted_project/gradlew ]; then
              cp -a extracted_project/. .
            else
              WRAPPER="$(find extracted_project -type f -name gradlew | head -n 1)"
              if [ -n "$WRAPPER" ]; then
                PROJECT_DIR="$(dirname "$WRAPPER")"
                cp -a "$PROJECT_DIR"/. .
              fi
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: gradlew not found in project root"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRSUB-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
