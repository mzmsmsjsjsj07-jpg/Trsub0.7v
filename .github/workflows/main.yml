- name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -t "$ZIP_FILE"

          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project

          GRADLEW="$(find extracted_project -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            find extracted_project -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "Android project found: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .
          chmod +x ./gradlew
